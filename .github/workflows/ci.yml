name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: bash scripts/ci.sh source
      - run: bash scripts/ci.sh contract
      - run: bash scripts/ci.sh audit
      - run: bash scripts/ci.sh build

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: bash scripts/ci.sh unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            TestResults/unit.xml
            coverage/
          if-no-files-found: error

  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci.sh smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-reports
          path: |
            TestResults/smoke.xml
            TestResults/playwright-html/
            TestResults/playwright-results/
          if-no-files-found: error

  registry-acceptance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select reviewed API source
        id: api
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('contracts/upstream/manifest.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(manifest.sourceCommit)) throw new Error('Invalid pinned API commit.');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${manifest.sourceCommit}\n`);
          JS
      - uses: actions/checkout@v4
        with:
          repository: MichalBoczula/ECommerceStore.Pact
          ref: ${{ steps.api.outputs.sha }}
          path: .tools/registry-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci.sh registry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-acceptance-reports
          path: TestResults/registry/
          if-no-files-found: error

  container:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the candidate image once
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ecommerce-store-pact-web:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test production Nginx and the anonymous API boundary
        env:
          PACT_WEB_IMAGE_PREBUILT: "true"
        run: bash scripts/ci.sh container
      - name: Scan the tested image for fixed high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-pact-web:ci
          scanners: vuln
          format: json
          output: TestResults/container/trivy.json
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record the tested and scanned image identity
        env:
          EXPECTED_IMAGE_ID: ${{ steps.image.outputs.imageid }}
        run: |
          mkdir -p artifacts/image
          docker image inspect ecommerce-store-pact-web:ci > "$RUNNER_TEMP/image-inspect.json"
          python3 scripts/image-metadata.py record --inspect "$RUNNER_TEMP/image-inspect.json" --commit "$GITHUB_SHA" --expected-id "$EXPECTED_IMAGE_ID" --out artifacts/image/image.json
          cp artifacts/image/image.json TestResults/container/image.json
      - name: Verify tested-image archive transfer without rebuilding
        run: |
          docker save ecommerce-store-pact-web:ci --output artifacts/image/pact-web-image.tar
          docker image rm ecommerce-store-pact-web:ci
          docker load --input artifacts/image/pact-web-image.tar
          docker image inspect ecommerce-store-pact-web:ci > "$RUNNER_TEMP/reloaded-image.json"
          python3 scripts/image-metadata.py verify --inspect "$RUNNER_TEMP/reloaded-image.json" --metadata artifacts/image/image.json --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pact-web-tested-image
          path: artifacts/image/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-image-reports
          path: TestResults/container/
          if-no-files-found: warn

  quality-gate:
    if: always()
    needs: [build, unit-tests, browser-smoke, registry-acceptance, dependency-review, secret-scan, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit-tests.result }}
          BROWSER: ${{ needs.browser-smoke.result }}
          REGISTRY: ${{ needs.registry-acceptance.result }}
          CONTAINER: ${{ needs.container.result }}
          DEPENDENCY: ${{ needs.dependency-review.result }}
          SECRETS: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          for job in BUILD UNIT BROWSER REGISTRY CONTAINER SECRETS; do
            if [[ "${!job}" != success ]]; then
              echo "$job must succeed; actual result: ${!job}" >&2
              exit 1
            fi
          done
          expected=success
          if [[ "$EVENT_NAME" == push ]]; then expected=skipped; fi
          if [[ "$DEPENDENCY" != "$expected" ]]; then
            echo "Dependency Review must be $expected; actual result: $DEPENDENCY" >&2
            exit 1
          fi

  publish-image:
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success' && needs.container.result == 'success' }}
    needs: [quality-gate, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACT_WEB_IMAGE_REPOSITORY: ${{ vars.DOCKER_IMAGE || 'mb0101/ecommerce-store-pact-web' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pact-web-tested-image
          path: artifacts/image
      - name: Load the tested image and verify its source identity
        run: |
          docker load --input artifacts/image/pact-web-image.tar
          docker image inspect ecommerce-store-pact-web:ci > "$RUNNER_TEMP/loaded-image.json"
          python3 scripts/image-metadata.py verify --inspect "$RUNNER_TEMP/loaded-image.json" --metadata artifacts/image/image.json --commit "$GITHUB_SHA"
      - name: Require configured Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKER_USERNAME" || { echo 'Missing Docker Hub username secret: DOCKER_USER' >&2; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo 'Missing Docker Hub token secret: DOCKER_TOKEN' >&2; exit 1; }
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}
      - name: Publish the loaded tested image without rebuilding
        run: bash scripts/publish-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pact-web-image-reference
          path: artifacts/image/image-reference.json
          if-no-files-found: error
          retention-days: 30
